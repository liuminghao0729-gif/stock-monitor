name: 每日选股更新
on:
  schedule:
    # 周一至周五 UTC 22:30(美西 14:30 或 15:30,美股 13:00 收盘后)。休市日由脚本判断并跳过。GitHub 可能有几分钟延迟。
    - cron: "30 22 * * 1-5"
  workflow_dispatch:      # 允许在网页上手动运行
    inputs:
      notify_only:
        description: "只发一条测试推送(不重新跑选股、不提交)"
        type: boolean
        default: false

# 只给这一个任务"写入仓库"的权限,用来把当天的结果提交回仓库;提交后 Vercel 会自动重新部署
permissions:
  contents: write

concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 判断今天是不是交易日
        id: gate
        if: ${{ !inputs.notify_only }}
        run: python3 push/market_push.py gate post
      - name: 保存上一份结果(用来对比有没有变化)
        if: ${{ !inputs.notify_only && steps.gate.outputs.run == 'true' }}
        run: cp public/screener.json /tmp/prev_screener.json
      - name: 运行每日选股(V2.0,盘后最终结果)
        if: ${{ !inputs.notify_only && steps.gate.outputs.run == 'true' }}
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: python3 tools/screener_v2.py --session post --history rw
      - name: 检查结果文件
        if: ${{ !inputs.notify_only && steps.gate.outputs.run == 'true' }}
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("public/screener.json"))
          assert d["version"] == 2 and d["presets"], "结果文件异常"
          assert d["universe"] >= 500, f"扫描到的股票只有 {d['universe']} 只,数据源可能被限流,不提交"
          print("行情日期", d["dataDate"], "| 扫描", d["universe"], "只 |", [(p["name"], p["confirmedTotal"]) for p in d["presets"]])
          PY
      - name: 有变化才提交
        if: ${{ !inputs.notify_only && steps.gate.outputs.run == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/screener.json public/screener_history.json
          if git diff --cached --quiet; then
            echo "今天的结果没有变化,不提交"
          else
            git commit -m "每日选股更新 $(date -u +%Y-%m-%d)"
            git pull --rebase -q
            git push
          fi
      - name: 手机推送盘后选股(失败不影响更新)
        if: ${{ inputs.notify_only || steps.gate.outputs.run == 'true' }}
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PREV_SCREENER: /tmp/prev_screener.json
        run: python3 push/market_push.py post --force
