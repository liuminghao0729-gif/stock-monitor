<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>高级风格预览</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{background:#000;font-family:"Inter",-apple-system,"PingFang SC","Helvetica Neue",sans-serif;font-size:14px;line-height:1.5}
.picker{position:sticky;top:0;z-index:50;display:flex;gap:8px;align-items:center;padding:10px 18px;background:#0a0a0a;border-bottom:1px solid #222;flex-wrap:wrap}
.picker b{color:#bbb;font-weight:500;margin-right:6px}
.picker button{border:1px solid #333;background:#161616;color:#ccc;padding:6px 14px;border-radius:99px;cursor:pointer;font:inherit;transition:.25s}
.picker button.on{background:#eee;color:#111;border-color:#eee}
.picker .d{color:#888;font-size:12px;margin-left:6px}

/* ============ 主题变量 ============ */
.site{--bg:#0d1512;--panel:#121c18;--text:#ece7da;--muted:#8a978f;--faint:#56635c;--line:rgba(236,231,218,.09);--accent:#c9aa6b;--up:#86bf9f;--down:#dc8c7e;
  --disp:"Cormorant Garamond","Songti SC","Noto Serif SC",Georgia,serif;--glow:rgba(201,170,107,.07);--pw:300;
  background:var(--bg);background-image:radial-gradient(900px 500px at 12% -10%,var(--glow),transparent 60%);color:var(--text);min-height:100vh;transition:background .5s,color .5s}
.site.f{--bg:#0e131b;--panel:#141b26;--text:#e7ecf3;--muted:#7f8ca0;--faint:#4d596b;--line:rgba(231,236,243,.08);--accent:#93b3dd;--up:#7cc3a8;--down:#df8f95;--disp:"Inter",-apple-system,"PingFang SC",sans-serif;--glow:rgba(147,179,221,.09)}
.site.g{--bg:#f3efe7;--panel:#faf8f3;--text:#1d1c1a;--muted:#8b867b;--faint:#bdb7aa;--line:rgba(29,28,26,.10);--accent:#9c7b3c;--up:#3d7a58;--down:#b2544a;--glow:rgba(156,123,60,.06);--pw:300}
.site,.site *{transition:background-color .45s,color .45s,border-color .45s,fill .45s,stroke .45s}
.wrap{max-width:1160px;margin:0 auto;padding:0 28px}
.up{color:var(--up)}.down{color:var(--down)}
.num{font-feature-settings:"tnum";font-variant-numeric:tabular-nums}

/* 入场动画:元素依次浮现 */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rise{opacity:0;animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards}

/* ============ 顶部 ============ */
.top{display:flex;justify-content:space-between;align-items:baseline;padding:30px 0 22px}
.brand{font-family:var(--disp);font-size:26px;letter-spacing:.14em;font-weight:600}
.brand i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:8px;vertical-align:middle;animation:pulse 2.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.status{color:var(--muted);font-size:12px;letter-spacing:.08em}
.status b{color:var(--accent);font-weight:500}
.idx{display:flex;gap:44px;padding:0 0 26px;border-bottom:1px solid var(--line);overflow-x:auto}
.idx .i{flex:0 0 auto}
.idx .n{font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.idx .v{font-size:18px;font-weight:400;margin-top:2px}
.idx .c{font-size:12px}
.idx svg{display:block;margin-top:4px}

/* ============ 主体 ============ */
.grid{display:grid;grid-template-columns:250px 1fr;gap:64px;padding:36px 0 80px}
@media(max-width:860px){.grid{grid-template-columns:1fr;gap:32px}}
.label{font-size:11px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;margin-bottom:10px}
.row{display:grid;grid-template-columns:1fr 54px auto;gap:12px;align-items:center;padding:14px 12px;margin:0 -12px;border-radius:10px;cursor:pointer;position:relative;transition:background .3s,transform .3s}
.row:hover{background:var(--panel);transform:translateX(3px)}
.row.sel{background:var(--panel)}
.row.sel::before{content:"";position:absolute;left:0;top:18%;bottom:18%;width:2px;background:var(--accent);border-radius:2px}
.row .s{font-weight:500;letter-spacing:.04em}.row .nm{font-size:12px;color:var(--muted)}
.row .r{text-align:right}.row .r div:last-child{font-size:12px}
.head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.head h1{font-family:var(--disp);font-size:34px;font-weight:600;letter-spacing:.02em}
.head span{color:var(--muted);font-size:14px}
.price{font-size:64px;font-weight:var(--pw);letter-spacing:-.02em;line-height:1.05;margin:10px 0 4px}
.chg{font-size:16px;font-weight:400;letter-spacing:.01em}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:20px;margin:30px 0 8px;padding:20px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
@media(max-width:700px){.stats{grid-template-columns:repeat(3,1fr)}}
.stats .l{font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.stats .v{font-size:16px;margin-top:2px}
.tabs{display:flex;gap:6px;position:relative;margin:22px 0 4px}
.tabs button{border:0;background:none;color:var(--muted);padding:6px 12px;font:inherit;cursor:pointer;letter-spacing:.04em;position:relative;z-index:1;transition:color .3s}
.tabs button.on{color:var(--text)}
.tabs .ind{position:absolute;bottom:0;height:1.5px;background:var(--accent);transition:left .35s cubic-bezier(.3,.8,.2,1),width .35s cubic-bezier(.3,.8,.2,1)}
.tabs .sp{flex:1}
.chartbox{position:relative;height:330px}
.chartbox svg{width:100%;height:100%;display:block;overflow:visible}
.tip{position:absolute;pointer-events:none;opacity:0;transition:opacity .2s;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;white-space:nowrap;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.tip b{font-weight:500;font-size:14px;display:block}
.tip small{color:var(--muted)}
.sub{display:flex;gap:26px;margin:34px 0 10px}
.sub span{color:var(--muted);cursor:pointer;padding-bottom:6px;border-bottom:1.5px solid transparent;transition:.3s;letter-spacing:.04em}
.sub span.on{color:var(--text);border-color:var(--accent)}
.news div{display:flex;justify-content:space-between;gap:20px;padding:14px 0;border-bottom:1px solid var(--line);transition:padding .3s}
.news div:hover{padding-left:6px}
.news small{color:var(--muted);white-space:nowrap}
.foot{color:var(--faint);font-size:11px;letter-spacing:.06em;padding:30px 0 40px}
</style>
</head>
<body>
<div class="picker"><b>配色:</b>
  <button data-t="e" class="on">E 墨绿 · 暖金</button><button data-t="f">F 雾蓝 · 石板</button><button data-t="g">G 象牙 · 墨黑(浅色)</button>
  <span class="d" id="desc"></span></div>

<div id="site" class="site e">
 <div class="wrap">
  <div class="top rise" style="animation-delay:.05s"><div class="brand">盯盘<i></i></div><div class="status"><b>●</b> 美股盘中 　09:42</div></div>
  <div class="idx rise" id="idx" style="animation-delay:.15s"></div>
  <div class="grid">
    <div class="rise" style="animation-delay:.25s"><div class="label">自选</div><div id="wl"></div></div>
    <div>
      <div class="head rise" style="animation-delay:.3s"><h1 id="tk">AAPL</h1><span id="tn">苹果</span></div>
      <div class="price num rise" id="price" style="animation-delay:.38s">342.37</div>
      <div class="chg num rise" id="chg" style="animation-delay:.44s">−1.80 　−0.52%</div>
      <div class="stats num rise" style="animation-delay:.5s">
        <div><div class="l">最高</div><div class="v" id="s0"></div></div><div><div class="l">最低</div><div class="v" id="s1"></div></div>
        <div><div class="l">今开</div><div class="v" id="s2"></div></div><div><div class="l">昨收</div><div class="v" id="s3"></div></div>
        <div><div class="l">成交量</div><div class="v" id="s4"></div></div><div><div class="l">市值</div><div class="v" id="s5"></div></div>
      </div>
      <div class="tabs rise" id="rng" style="animation-delay:.56s"><button>1分 ▾</button><button class="on">日K</button><button>周K</button><button>月K</button><button>季K</button><button>年K</button><span class="ind"></span></div>
      <div class="chartbox rise" id="cbox" style="animation-delay:.6s"><svg id="chart"></svg><div class="tip" id="tip"></div></div>
      <div class="sub rise" style="animation-delay:.66s"><span class="on">图表</span><span>公司</span></div>
      <div class="news rise" style="animation-delay:.7s">
        <div><span>分析师上调目标价,看好下半年业绩</span><small>彭博 · 1 小时前</small></div>
        <div><span>管理层在行业会议上谈及新产品进展</span><small>路透 · 2 小时前</small></div>
        <div><span>期权市场出现大额成交</span><small>CNBC · 3 小时前</small></div>
      </div>
      <div class="foot">行情数据可能延迟,仅供参考,不构成投资建议</div>
    </div>
  </div>
 </div>
</div>

<script>
const $=s=>document.querySelector(s);
const DESC={e:'深墨绿底、暖金点缀、衬线品牌字。像私人银行的数字界面,沉稳、有质感。',f:'深石板蓝灰底、雾蓝点缀、纯无衬线。偏科技金融,冷静克制,最耐看。',g:'象牙白底、墨黑文字、古铜点缀。像高端编辑杂志,明亮但不刺眼。'};
const ST={AAPL:{n:'苹果',p:342.37,c:-0.52,seed:7},NVDA:{n:'英伟达',p:186.64,c:2.78,seed:11},VOO:{n:'标普500 ETF',p:675.99,c:0.30,seed:23},QQQ:{n:'纳指100 ETF',p:656.10,c:1.40,seed:31}};
const IDX=[['标普500','7,377','+0.31%',1,3],['纳斯达克','24,579','+1.09%',1,5],['道琼斯','51,286','−0.46%',0,9],['黄金','4,075','−0.94%',0,13],['10年美债','4.86%','+0.45%',1,17]];
let cur='AAPL',range=1;
function series(seed,n,end,drift){let s=seed*977+n;const r=()=>(s=(s*1664525+1013904223)>>>0)/4294967296;let v=100,a=[];for(let i=0;i<n;i++){v*=1+(r()-.5)*.03+drift;a.push(v)}const k=end/a[n-1];return a.map(x=>x*k)}
function spark(seed,up,w=64,h=22){const a=series(seed,28,100,up?.002:-.002);const lo=Math.min(...a),hi=Math.max(...a);const d=a.map((v,i)=>`${i?'L':'M'}${i*w/27},${h-(v-lo)/(hi-lo)*h}`).join(' ');return `<svg width="${w}" height="${h}"><path d="${d}" fill="none" stroke="var(--${up?'up':'down'})" stroke-width="1.2" opacity=".9"/></svg>`}
$('#idx').innerHTML=IDX.map(i=>`<div class="i"><div class="n">${i[0]}</div><div class="v num">${i[1]}</div><div class="c num ${i[3]?'up':'down'}">${i[2]}</div>${spark(i[4],i[3])}</div>`).join('');
function renderWL(){$('#wl').innerHTML=Object.entries(ST).map(([k,s],i)=>`<div class="row ${k===cur?'sel':''} rise" style="animation-delay:${.3+i*.06}s" data-k="${k}"><div><div class="s">${k}</div><div class="nm">${s.n}</div></div>${spark(s.seed,s.c>=0)}<div class="r num"><div>${s.p.toFixed(2)}</div><div class="${s.c>=0?'up':'down'}">${s.c>=0?'+':'−'}${Math.abs(s.c).toFixed(2)}%</div></div></div>`).join('')}
renderWL();
$('#wl').onclick=e=>{const r=e.target.closest('.row');if(!r)return;setStock(r.dataset.k)};

const VOLM={AAPL:['4375万','5.0万亿'],NVDA:['1.79亿','4.5万亿'],VOO:['520万','—'],QQQ:['3380万','—']};
function setStats(k){const s=ST[k],pc=s.p/(1+s.c/100);const v=[s.p*Math.max(1.004,1+s.c/100+.004),s.p*Math.min(.992,1+s.c/100-.006)/(1+s.c/100)*(1+s.c/100),pc*(1+s.c/100*.2),pc].map(x=>x.toFixed(2));
  v[0]=(Math.max(s.p,pc)*1.006).toFixed(2);v[1]=(Math.min(s.p,pc)*.992).toFixed(2);
  [...v,...VOLM[k]].forEach((t,i)=>document.getElementById('s'+i).textContent=t)}
let shown=342.37;
function countTo(el,to,dur=650){const from=shown,t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=(from+(to-from)*e).toFixed(2);if(k<1)requestAnimationFrame(f);else shown=to})(t0)}
function setStock(k){cur=k;const s=ST[k];setStats(k);$('#tk').textContent=k;$('#tn').textContent=s.n;countTo($('#price'),s.p);
  const up=s.c>=0,ch=s.p*s.c/100;$('#price').className='price num '+(up?'up':'down');$('#chg').className='chg num '+(up?'up':'down');$('#chg').textContent=`${up?'+':'−'}${Math.abs(ch).toFixed(2)} 　${up?'+':'−'}${Math.abs(s.c).toFixed(2)}%`;
  document.querySelectorAll('.row').forEach(r=>r.classList.toggle('sel',r.dataset.k===k));drawChart(true)}

// 页签下划线滑动
function moveInd(){const b=document.querySelectorAll('#rng button')[range],i=$('#rng .ind');i.style.left=b.offsetLeft+'px';i.style.width=b.offsetWidth+'px'}
$('#rng').onclick=e=>{const b=e.target.closest('button');if(!b)return;range=[...document.querySelectorAll('#rng button')].indexOf(b);document.querySelectorAll('#rng button').forEach((x,i)=>x.classList.toggle('on',i===range));moveInd();drawChart(true)}

// 图表:面积渐变 + 曲线描绘动画 + 十字线提示
let data=[];
function drawChart(anim){
  const box=$('#cbox'),W=box.clientWidth,H=box.clientHeight,pr=54,pb=26,pt=8,s=ST[cur],n=[60,120,90,80,60,40][range]||90;
  data=series(s.seed+range*3,n,s.p,s.c>=0?.0012:-.0012);
  const lo=Math.min(...data),hi=Math.max(...data),pad=(hi-lo)*.12,L=lo-pad,Hh=hi+pad,X=i=>i*(W-pr)/(n-1),Y=v=>pt+(1-(v-L)/(Hh-L))*(H-pt-pb);
  const css=getComputedStyle($('#site')),col=css.getPropertyValue(s.c>=0?'--up':'--down').trim(),ln=css.getPropertyValue('--line').trim(),mu=css.getPropertyValue('--muted').trim();
  const d=data.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' '),area=d+` L${X(n-1)},${H-pb} L0,${H-pb} Z`;
  let g='';for(let k=0;k<4;k++){const y=pt+k*(H-pt-pb)/3,v=Hh-(Hh-L)*k/3;g+=`<line x1="0" x2="${W-pr}" y1="${y}" y2="${y}" stroke="${ln}"/><text x="${W-pr+10}" y="${y+4}" fill="${mu}" font-size="11">${v.toFixed(1)}</text>`}
  const ly=Y(data[n-1]);
  $('#chart').setAttribute('viewBox',`0 0 ${W} ${H}`);
  $('#chart').innerHTML=`<defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>${g}
   <path id="ar" d="${area}" fill="url(#ag)" style="opacity:${anim?0:1};transition:opacity 1s .35s"/>
   <path id="ln" d="${d}" fill="none" stroke="${col}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
   <line x1="0" x2="${W-pr}" y1="${ly}" y2="${ly}" stroke="${col}" stroke-dasharray="2 5" opacity=".5"/>
   <circle cx="${X(n-1)}" cy="${ly}" r="3.5" fill="${col}"/><circle cx="${X(n-1)}" cy="${ly}" r="3.5" fill="none" stroke="${col}"><animate attributeName="r" values="3.5;11" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0" dur="2.4s" repeatCount="indefinite"/></circle>
   <line id="cl" y1="${pt}" y2="${H-pb}" stroke="${mu}" stroke-dasharray="3 4" opacity="0"/><circle id="cd" r="4.5" fill="${col}" stroke="var(--bg)" stroke-width="2" opacity="0"/>`;
  if(anim){const p=$('#ln'),len=p.getTotalLength();p.style.strokeDasharray=len;p.style.strokeDashoffset=len;p.getBoundingClientRect();p.style.transition='stroke-dashoffset 1.1s cubic-bezier(.3,.7,.2,1)';p.style.strokeDashoffset=0;requestAnimationFrame(()=>$('#ar').style.opacity=1)}
  const tip=$('#tip'),svg=$('#chart');
  svg.onmousemove=e=>{const r=svg.getBoundingClientRect(),x=Math.max(0,Math.min(W-pr,e.clientX-r.left)),i=Math.round(x/((W-pr)/(n-1))),px=X(i),py=Y(data[i]);
    $('#cl').setAttribute('x1',px);$('#cl').setAttribute('x2',px);$('#cl').setAttribute('opacity',.6);$('#cd').setAttribute('cx',px);$('#cd').setAttribute('cy',py);$('#cd').setAttribute('opacity',1);
    tip.innerHTML=`<b class="num">${data[i].toFixed(2)}</b><small>第 ${i+1} 根</small>`;tip.style.opacity=1;tip.style.left=Math.min(W-pr-90,px+14)+'px';tip.style.top=Math.max(0,py-52)+'px'};
  svg.onmouseleave=()=>{tip.style.opacity=0;$('#cl').setAttribute('opacity',0);$('#cd').setAttribute('opacity',0)};
}
function theme(t){$('#site').className='site '+t;document.querySelectorAll('.picker button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));$('#desc').textContent=DESC[t];document.body.style.background=t==='g'?'#f3efe7':'#000';setTimeout(()=>{renderWL();drawChart(false)},60)}
document.querySelectorAll('.picker button').forEach(b=>b.onclick=()=>theme(b.dataset.t));
window.addEventListener('resize',()=>{moveInd();drawChart(false)});
window.addEventListener('load',()=>{moveInd();drawChart(true)});
$('#desc').textContent=DESC.e;setStats('AAPL');
setTimeout(()=>{moveInd();drawChart(true)},50);
</script>
</body>
</html>
