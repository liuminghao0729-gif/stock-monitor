<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>盯盘</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>window.va = window.va || function () { (window.va.q = window.va.q || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<div class="haze"><i class="a"></i><i class="b"></i></div>
<div class="grain"></div>

<div class="shell">
<header class="top">
  <div class="brand">盯盘<i></i></div>
  <div class="status">
    <span id="mkt" class="pill">--</span>
    <span id="clock"></span>
    <span id="liveInd" class="live"><i></i><span id="liveTxt">--</span></span>
    <span id="authBox"></span>
    <span class="badge" id="dataMode"></span>
    <span class="cd"><span id="countdown">--</span></span>
  </div>
</header>

<section id="indices" class="strip"></section>

<nav id="tabs" class="tabs">
  <button data-tab="watch" class="p on">看盘</button>
  <button data-tab="mylist" class="p">自选股</button>
  <button data-tab="sectors" class="p">板块</button>
  <button data-tab="picks" class="p">股票推荐</button>
  <span class="nsep"></span>
  <button data-tab="screen" class="s">条件筛选</button>
  <button data-tab="earnings" class="s">财报日历</button>
  <button data-tab="movers" class="s">涨跌幅榜</button>
  <button data-tab="macro" class="s">宏观</button>
  <button data-tab="alerts" class="s">快讯</button>
</nav>

<main>
  <div id="view-watch" class="view">
    <div class="srow2">
      <div id="searchBox">
        <form id="addForm" class="addrow">
          <input id="addInput" placeholder="搜索代码或公司名,如 TSLA、甲骨文" maxlength="30" autocomplete="off" aria-label="搜索股票">
          <button type="submit">搜索</button>
        </form>
        <div id="sugg" class="sugg hidden"></div>
        <div id="addMsg" class="muted small"></div>
      </div>
      <div class="quickwrap"><button id="addCur" class="addcur" type="button" hidden></button></div>
    </div>
    <section class="card" id="detail"></section>
  </div>
  <div id="view-mylist" class="view hidden"><div class="card" id="watchPanel"><div id="watchList"></div></div>
    <div class="card" id="holdBox"><h3 style="margin-top:0">我的持仓</h3><div class="muted small" id="holdNote"></div>
      <form id="holdForm" class="holdform"><input id="hSym" placeholder="代码" maxlength="8" autocomplete="off"><input id="hQty" placeholder="股数" inputmode="decimal" autocomplete="off"><input id="hCost" placeholder="成本价" inputmode="decimal" autocomplete="off"><button type="submit">添加/更新</button></form>
      <div id="holdMsg" class="muted small"></div><div id="holdList"></div></div>
    <div class="card" id="tgBox"></div></div>
  <div id="view-sectors" class="view hidden"></div>
  <div id="view-screen" class="view hidden"></div>
  <div id="view-earnings" class="view hidden"></div>
  <div id="view-movers" class="view hidden"></div>
  <div id="view-picks" class="view hidden"></div>
  <div id="view-macro" class="view hidden"></div>
  <div id="view-alerts" class="view hidden"></div>
</main>

<footer>行情数据可能延迟。模型信号不保证收益,可能亏损,请自行判断风险。</footer>
</div>

<script src="companies.js"></script>
<script src="profiles.js"></script>
<script src="mock.js"></script>
<script src="live.js"></script>
<script src="patterns.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="auth.js"></script>
<script src="app.js"></script>
</body>
</html>
