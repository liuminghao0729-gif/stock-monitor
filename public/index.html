<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>盯盘</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="haze"><i class="a"></i><i class="b"></i></div>
<div class="grain"></div>

<div class="shell">
<header class="top">
  <div class="brand">盯盘<i></i></div>
  <div class="status">
    <span id="mkt" class="pill">--</span>
    <span id="clock"></span>
    <span class="badge" id="dataMode"></span>
    <span class="cd"><span id="countdown">--</span></span>
  </div>
</header>

<section id="indices" class="strip"></section>

<nav id="tabs" class="tabs">
  <button data-tab="watch" class="on">看盘</button>
  <button data-tab="sectors">板块</button>
  <button data-tab="earnings">财报日历</button>
  <button data-tab="movers">涨跌幅榜</button>
  <button data-tab="picks">股票推荐</button>
  <button data-tab="macro">宏观</button>
  <button data-tab="alerts">快讯</button>
</nav>

<main>
  <div id="view-watch" class="view">
    <aside class="card" id="watchPanel">
      <form id="addForm" class="addrow">
        <input id="addInput" placeholder="添加代码,如 TSLA" maxlength="8" autocomplete="off">
        <button type="submit">添加</button>
      </form>
      <div id="addMsg" class="muted small"></div>
      <div id="watchList"></div>
    </aside>
    <section class="card" id="detail"></section>
  </div>
  <div id="view-sectors" class="view hidden"></div>
  <div id="view-earnings" class="view hidden"></div>
  <div id="view-movers" class="view hidden"></div>
  <div id="view-picks" class="view hidden"></div>
  <div id="view-macro" class="view hidden"></div>
  <div id="view-alerts" class="view hidden"></div>
</main>

<footer>行情数据可能延迟。模型信号不保证收益,可能亏损,请自行判断风险。</footer>
</div>

<script src="companies.js"></script>
<script src="profiles.js"></script>
<script src="mock.js"></script>
<script src="live.js"></script>
<script src="patterns.js"></script>
<script src="app.js"></script>
</body>
</html>
